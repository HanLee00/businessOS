# Populate exact Zoho account IDs/names only after each chart of accounts is
# reviewed. Never infer mappings from similar account names across businesses.

ohvenus_daily_journal:
  organization_id: "933897042"
  chart_reviewed_on: 2026-09-02
  source_activity_check:
    period_start: 2026-08-01
    period_end: 2026-09-02
    manual_journals: 0
    sales_receipts: 0
    invoices: 0
    expenses: 0
    bank_transactions: 0
  reference_pattern: OHV-PNL-<local-date>
  status_during_trial: draft
  existing_balance_sheet_accounts:
    inventory_asset:
      account_id: "907512000000034001"
      account_name: Inventory Asset
      account_type: stock
    tax_payable:
      account_id: "907512000000000376"
      account_name: Tax Payable
      account_type: other_current_liability
  balance_sheet_accounts:
    stripe_clearing:
      account_id: "907512000000120002"
      account_name: Stripe Clearing
      account_type: other_current_asset
    billplz_clearing:
      account_id: "907512000000121002"
      account_name: Billplz Clearing
      account_type: other_current_asset
    other_payment_clearing:
      account_id: "907512000000122002"
      account_name: Other Payment Clearing
      account_type: other_current_asset
    meta_payable:
      account_id: "907512000000110003"
      account_name: Meta Payable
      account_type: other_current_liability
    easyparcel_wallet:
      account_id: "907512000000123002"
      account_name: EasyParcel Wallet
      account_type: other_current_asset
    packaging_cost_accrual:
      account_id: "907512000000124002"
      account_name: Packaging Cost Accrual
      account_type: other_current_liability
  balancing_rules:
    sales_and_payments:
      debit:
        - processor clearing for captured sales, shipping, refunds, and processor fees netted to the expected settlement
        - Discount for Shopify discounts
        - Stripe Fees for the confirmed Stripe fee calculation
        - Billplz Fees for the confirmed Billplz per-transaction fee
      credit:
        - Sales for gross product revenue
        - Shipping Charge for customer shipping collected
    inventory:
      debit:
        - Cost of Goods Sold for Shopify product unit costs
      credit:
        - Inventory Asset for the same amount
    meta:
      debit:
        - Meta Ads for actual daily spend
        - Meta Platform Fees for eight percent of actual daily spend
      credit:
        - Meta Payable for both components
    packaging:
      debit:
        - Packaging Cost for two percent of actual daily Meta spend
      credit:
        - Packaging Cost Accrual for the same amount
    courier:
      debit:
        - Courier Cost for identity-verified EasyParcel detail totals
      credit:
        - EasyParcel Wallet for the same amount
  controls:
    - Total debits must equal total credits before draft creation.
    - Every source amount must be denominated in MYR or fail the run.
    - A source exception or missing EasyParcel detail cost blocks draft creation.
    - Existing Zoho activity for the same source and date blocks the run for review.
    - Account creation and journal creation remain separate approval-gated actions.
