schema_version: 1
business_id: gaia
document_email: gaiagiftsco@gmail.com
website: gaiagifts.co

branding:
  template_version: gaia_invoice_v1
  approval_status: owner_approved
  style: minimal_earthy
  page_size: A4
  logo:
    file: assets/gaia-logo-240.png
    position: top_left
    display_size_pt: 28
    treatment: small_monochrome_mark
  palette:
    primary_sage: "#606F52"
    pale_sage: "#EEF3E9"
    text: "#111111"
  color_usage:
    - sage_table_header
    - pale_sage_balance_band
    - sage_invoice_title_rule
    - sage_section_accent_rules
    - sage_website_text

templates:
  standard:
    zoho_template_id: "726115000000017001"
    zoho_template_name: Standard Template
    use_for: uniforms_and_clothing
    rule: Default template unless the order is explicitly gift/merch.
  gift:
    zoho_template_id: "726115000000122002"
    zoho_template_name: Gift
    use_for: gift_and_merch
    rule: Use for corporate gift sets, promotional merchandise, and non-apparel branded items.
  note: >-
    Pick by order content, not by customer. A customer that orders both uniforms
    and gift sets gets one invoice per template as needed.

item_master_naming:
  rule: >-
    When a product has a known product code (for example L01, QD04, CRP7200),
    the item master name leads with that code, then the product name, then the
    GSM if one was given - never bury the code mid-name or drop it. If no code
    applies to the product line (for example the Sublimation Polo/Round Neck
    items), name it plainly with no invented code.
  examples:
    - "QD04 Microfibre Round Neck Tshirt - 160gsm"
    - "CRP7200 Microfibre Polo Tshirt 160gsm"
    - "L01 Honeycomb Cotton Polo (210gsm)"
  note: >-
    GSM placement style (trailing, parenthesised, or dashed) has varied
    historically - match the existing item if one already exists for that
    code, otherwise trailing "- <n>gsm" is fine for new items.

bill_to_block:
  company_name_rule: Always keep the customer company name as the first line.
  physical_address_present:
    rule: Use the customer's real billing address recorded in Zoho.
  physical_address_missing:
    rule: >-
      When no real billing address was supplied, fill the otherwise-empty Bill
      To block with every customer contact detail the owner supplied. Include
      only known values and never invent a placeholder.
    customer_facing_order:
      - contact_person_name
      - phone
      - email
    zoho_contact_billing_address_mapping:
      attention: contact_person_name
      address: phone
      street2: email
    populate_on: customer_contact_before_invoice_creation
    phone_format: Preserve the supplied phone number exactly, including a leading zero.
    non_address_fulfilment_phrases:
      - self collection
      - no shipping fee
    fulfilment_rule: >-
      Fulfilment phrases belong in the invoice notes and shipping charge; never
      store them as the customer's physical address.
    approval_rule: >-
      Show the proposed Bill To lines in the invoice preview. Creating or
      updating the customer contact with this fallback is covered only when it
      is included in the approved draft action.
    invoice_creation_rule: >-
      Do not pass billing_address on the invoice-create call. Populate the Zoho
      contact first and let the invoice inherit it.
    single_source_for_invoice_address_api_failure: workflows/invoicing/README.md#failure-modes-already-hit-in-production
    verification_status: >-
      Owner-approved default on 2026-08-13; the exact rendered fallback order
      still needs one supervised live draft update before it is called verified.

line_item_description_format:
  rule: >-
    Never write order specifics as one comma-separated line. Break each distinct
    detail onto its own line — this applies to any order type, not apparel only:
    item/variant name (plus any variant detail such as colour or material), then a
    labelled section per detail group (for example "Heat Press Print:" for
    apparel, or numbered components for a gift set) with one line per
    position/component, then a labelled breakdown (size, quantity, etc.) with one
    line per entry.
  example: |
    Custom Made Polo Tshirt - Lacoste Cotton 220gsm (Navy/Dark Green/Yellow)
    HEATPRESS PRINT (DTF):
    Front left - 3.5 inch
    Front right - 3.5 inch
    Front left (bottom) - 2 inch
    Left sleeve - 2 inch
    Right sleeve - 3.5 inch
    Back - 1.5 inch
  multi_colour_sizing_rule: >-
    When one line item covers several distinct colours (for example, blank
    stock pulled from a colour chart), do not merge all colours into one
    "Colour - Size" list. Give each colour its own labelled size block:
    "SIZES (<Colour>):" followed by one line per size/qty for that colour
    only, repeated per colour in the order they were requested.
  multi_colour_example: |
    QD04 Microfibre Round Neck Tshirt - 160gsm - Blank (No Print)
    SIZES (Yellow):
    S - 1
    XL - 1
    SIZES (Neon Orange):
    S - 1
    XL - 1
    SIZES (Orange):
    S - 1
    SIZES (White):
    XL - 1
    SIZES (Royal):
    S - 1

reference_number:
  rule: always_set
  format: "<CUSTOMERCODE>-<YYYYMMDD>-<ITEMCODE>"
  note: >-
    Set on every invoice regardless of whether the customer supplied a real PO
    number. Used for internal lookup, not a claim that it is the customer's PO.
  single_source: workflows/invoicing/README.md#failure-modes-already-hit-in-production
  how_to_set: >-
    Use the raw API proxy (PUT /invoices/{id}). The wrapper's behaviour with
    this field is unreliable, and an immediate read-back can return stale data -
    the full explanation lives in the file named above. Do not restate it here.

file_naming:
  order: invoice_number_then_company_name
  pattern: "IV #<invoice_number> - <customer_company_name>.pdf"
  company_name_source: zoho_customer_company_name
  preserve_spaces: true
  required_for_exports: true

invoice_numbering:
  mode: explicit_unique_number
  source: zoho_books_live_read
  duplicate_check_required: true
  single_source: workflows/invoicing/README.md#invoice-numbering
  note: >-
    No counter is stored here - Zoho Books owns the sequence. The method for
    reading the next number is defined once, in the file named above. Do not
    restate it here; a second copy is how this file once carried a wrong method
    (sort by created_time) months after the correct one was written elsewhere.

shipping_policy:
  quantity_basis: total_product_piece_quantity_excluding_shipping_and_service_lines
  region_source: customer_delivery_address_then_billing_address
  presentation:
    fixed_format: true
    zoho_field: shipping_charge
    scope: invoice_level
    display_location: totals_summary_after_product_subtotal
    prohibit_shipping_as_line_item: true
  west_malaysia:
    quantity_up_to_and_including: 100
    default_fee_myr: 15
    action: apply_automatically
    quantity_above_100:
      action: ask_owner_before_invoice_creation
      prompt: Confirm whether the standard RM15 shipping fee changes for this order.
  east_malaysia:
    action: ask_owner_before_invoice_creation
    default_fee_myr: null
    prompt: Confirm the shipping fee before creating the invoice.
  missing_or_ambiguous_region:
    action: ask_owner_before_invoice_creation
    prompt: Confirm the delivery region and shipping fee before creating the invoice.
  legacy_shipping_item:
    zoho_item_id: "726115000000108002"
    zoho_item_name: Shipping Fee - West Malaysia
    rule: do_not_use
    note: Superseded by the invoice-level Shipping Charges field. Never add shipping as a line item.

invoice_notes:
  payment_terms: "Payment Terms: Full payment is required before delivery."
  lead_time: "Lead Time: 7-14 working days from receipt of full payment and written confirmation of the final artwork."

payment_details:
  source_of_truth: zoho_books
  store_exact_bank_details_here: false
  invoice_field: terms
  note: >-
    Bank details live only in Zoho. They are written into the invoice `terms`
    field at creation time; `notes` carries payment terms and lead time.

sender_identity:
  document_email: gaiagiftsco@gmail.com
  rule: Never display a personal email address on a Gaia document.
