schema_version: 1

allowed_statuses:
  - proposed
  - documented
  - dry_run
  - supervised
  - active
  - paused
  - retired

automations:
  - automation_id: finance.invoice_prepare
    name: Prepare invoice payload
    applies_to: [gaia, ohvenus]
    trigger: manual_request
    status: documented
    approval_level: A1
    system: zoho_books
    action: validate inputs, resolve existing references, and preview totals/payload
    external_write: false
    evidence: workflows/invoicing/README.md

  - automation_id: finance.invoice_create_draft
    name: Create unsent invoice draft
    applies_to: [gaia, ohvenus]
    trigger: explicit_user_approval
    status: supervised
    approval_level: A2
    system: zoho_books
    action: create a draft invoice without sending or recording payment
    external_write: true
    prerequisites:
      - verified organization mapping
      - authorized Zoho Books connection
      - duplicate check
      - business shipping policy resolved, including any required owner confirmation
      - payload preview approved
    evidence: workflows/invoicing/README.md

  - automation_id: finance.invoice_send
    name: Send approved invoice
    applies_to: [gaia, ohvenus]
    trigger: explicit_user_approval
    status: proposed
    approval_level: A3
    system: zoho_books
    action: send a reviewed invoice to the confirmed recipient
    external_write: true
    prerequisites:
      - reviewed external draft
      - recipient confirmed
      - final totals and attachments confirmed

  - automation_id: finance.payment_record
    name: Record invoice payment
    applies_to: [gaia, ohvenus]
    trigger: explicit_user_approval
    status: proposed
    approval_level: A3
    system: zoho_books
    action: record payment against an existing invoice
    external_write: true

  - automation_id: finance.invoice_reminder
    name: Send invoice reminder
    applies_to: [gaia, ohvenus]
    trigger: manual_request
    status: proposed
    approval_level: A3
    system: zoho_books
    action: send a reminder for a verified outstanding invoice
    external_write: true

  - automation_id: finance.ohvenus_daily_pnl
    name: Prepare Oh! Venus daily P&L journal
    applies_to: [ohvenus]
    trigger: "daily at 12:00 Asia/Kuala_Lumpur"
    status: dry_run
    approval_level: A3
    system: cloudflare_workers_to_zoho_books
    action: reconcile the prior Malaysia calendar day and prepare one deterministic Zoho manual-journal preview
    external_write: false
    prerequisites:
      - verified Oh! Venus organization 933897042
      - approved account mapping
      - connected Shopify, Meta Ads, EasyParcel, and Zoho credentials in the hosted secret store
      - balanced MYR journal and duplicate-source check
      - seven supervised draft runs before any publishing approval
    evidence: ohvenus-pnl-worker/README.md
    deployment_url: https://ohvenus-daily-pnl.ohvenus-shop.workers.dev

# The Oh! Venus preview-only cron is deployed but cannot read sources or write a
# journal yet. Enabling financial writes requires monitoring, failure handling,
# supervised evidence, and explicit owner approval.
